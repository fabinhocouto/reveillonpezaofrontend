
<div class="container">
  <mat-card>
    <mat-card-title>Gerar Ingressos</mat-card-title>
    <mat-card-subtitle>
      Preencha os dados para gerar os convites
    </mat-card-subtitle>

    <!-- Mensagem de sucesso -->
    <div class="mensagem-sucesso" *ngIf="mensagemSucesso">
      <mat-icon>check_circle</mat-icon>
      {{ mensagemSucesso }}
    </div>

    <form [formGroup]="formConvite" (ngSubmit)="gerarIngresso()">

      <!-- Nome -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nome do convidado</mat-label>
        <input matInput formControlName="nome" placeholder="Digite o nome">
        <mat-icon matSuffix>person</mat-icon>

        <mat-error *ngIf="formConvite.get('nome')?.hasError('required')">
          Informe o nome do convidado
        </mat-error>
      </mat-form-field>

      <!-- Telefone -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Telefone</mat-label>
        <input matInput formControlName="telefone"
               placeholder="(31) 99999-9999"
               maxlength="15">
        <mat-icon matSuffix>phone</mat-icon>

        <mat-error *ngIf="formConvite.get('telefone')?.invalid">
          Informe um telefone válido
        </mat-error>
      </mat-form-field>

      <!-- Quantidade -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Quantidade de convites</mat-label>
        <input matInput type="number" formControlName="quantidade"
               min="1" max="100">
        <mat-icon matSuffix>confirmation_number</mat-icon>

        <mat-error *ngIf="formConvite.get('quantidade')?.invalid">
          Informe uma quantidade entre 1 e 100
        </mat-error>
      </mat-form-field>

      <!-- Botão -->
      <button mat-raised-button type="submit"
              class="botao-gerar"
              [disabled]="formConvite.invalid">

        <mat-icon>confirmation_number</mat-icon>
        Gerar Ingresso
      </button>

    </form>
  </mat-card>
</div>

<app-rodada *ngIf="isApostar" (fecharAposta)="aoFecharAposta()"></app-rodada>
<div class="container" *ngIf="!isApostar">
    <mat-card>
      <mat-card-title>Minhas Apostas</mat-card-title>
  
      <!-- Loading Spinner -->
      <mat-spinner *ngIf="isLoading"></mat-spinner>
  
      <div *ngIf="!isLoading">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

            <!-- Rodada -->
          <ng-container matColumnDef="rodada">
            <th mat-header-cell *matHeaderCellDef> Jogo </th>
            <td mat-cell *matCellDef="let element"> {{ element.rodada.id }} </td>
          </ng-container>
  
          <!-- Números -->
          <ng-container matColumnDef="numeros">
            <th mat-header-cell *matHeaderCellDef class="col-numeros"> Números </th>
            <td mat-cell *matCellDef="let element" class="col-numeros">
                <div class="numero-container">
                    <span 
                        class="numero-bola" 
                        *ngFor="let numero of element.numeros.split(';')"
                        [ngClass]="{'numero-verde': numero.includes('*')}"
                    >
                        {{ numero.replace('*', '') }}
                    </span>
                </div>
            </td>
          </ng-container>
  
          <!-- Acertos -->
          <ng-container matColumnDef="acertos">
            <th mat-header-cell *matHeaderCellDef> Acertos </th>
            <td mat-cell *matCellDef="let element"> {{ element.acertos }} </td>
          </ng-container>
             
          <!-- Código PIX -->
          <ng-container matColumnDef="codigoPix">
            <th mat-header-cell *matHeaderCellDef> PIX Copia e Cola</th>
            <td mat-cell *matCellDef="let element"> {{ element.codigoPix }} </td>
          </ng-container>
  
        <!-- Status -->
        <ng-container matColumnDef="statusAposta">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let element">
              {{ formatarStatus(element.statusAposta) }}
            </td>
          </ng-container>    
  
          <!-- Cabeçalho e Linhas -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
  
        <!-- Paginação -->
        <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>

        <!-- Botão Apostar -->
        <div class="botao-apostar-container">
            <button mat-raised-button class="botao-apostar" (click)="apostar()">
            Fazer nova aposta
            </button>
        </div>
  
      </div>
    </mat-card>
  </div>
